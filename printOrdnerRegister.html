<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Ordner Register Editor</title>

    <style>
        :root {
            --radius: 0.375rem;
            --radius-lg: 0.5rem;
            --radius-xl: 0.75rem;
            --color-border: #d1d5db;
            --color-primary: #2563eb;
            --color-primary-dark: #1d4ed8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f9fafb;
            color: #111827;
            height: 100vh;
        }

        h1, h2, h3 { font-weight: 700; }
        h1 { font-size: 1.875rem; }
        h2 { font-size: 1.25rem; }

        /* Flexbox utilities */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-1 { flex: 1; }
        .flex-shrink-0 { flex-shrink: 0; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .justify-end { justify-content: flex-end; }

        /* Spacing utilities */
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .mb-1 { margin-bottom: 0.25rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-3 { margin-top: 0.75rem; }
        .mt-4 { margin-top: 1rem; }
        .mt-5 { margin-top: 1.25rem; }
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .px-1 { padding: 0 0.25rem; }
        .px-2 { padding: 0 0.5rem; }
        .px-3 { padding: 0 0.75rem; }
        .px-4 { padding: 0 1rem; }
        .px-6 { padding: 0 1.5rem; }
        .py-1 { padding: 0.25rem 0; }
        .py-2 { padding: 0.5rem 0; }
        .py-4 { padding: 1rem 0; }

        /* Sizing */
        .w-full { width: 100%; }
        .w-12 { width: 3rem; }
        .h-12 { height: 3rem; }
        .h-10 { height: 2.5rem; }
        .min-w-0 { min-width: 0; }
        .max-w-md { max-width: 28rem; }
        .max-w-2xl { max-width: 42rem; }
        .max-h-\[90vh\] { max-height: 90vh; }

        /* Position & Display */
        .fixed { position: fixed; }
        .absolute { position: absolute; }
        .relative { position: relative; }
        .sticky { position: sticky; }
        .inset-0 { inset: 0; }
        .inset-x-0 { left: 0; right: 0; }
        .top-0 { top: 0; }
        .z-40 { z-index: 40; }
        .z-50 { z-index: 50; }
        .hidden { display: none; }
        .overflow-auto { overflow: auto; }
        .overflow-y-auto { overflow-y: auto; }
        .overflow-hidden { overflow: hidden; }

        /* Colors - Background */
        .bg-white { background-color: #fff; }
        .bg-gray-50 { background-color: #f9fafb; }
        .bg-gray-100 { background-color: #f3f4f6; }
        .bg-gray-200 { background-color: #e5e7eb; }
        .bg-blue-50 { background-color: #eff6ff; }
        .bg-blue-100 { background-color: #dbeafe; }
        .bg-blue-600 { background-color: #2563eb; }
        .bg-blue-700 { background-color: #1d4ed8; }
        .bg-green-50 { background-color: #f0fdf4; }
        .bg-green-100 { background-color: #dcfce7; }
        .bg-green-600 { background-color: #16a34a; }
        .bg-green-700 { background-color: #15803d; }
        .bg-purple-600 { background-color: #9333ea; }
        .bg-purple-700 { background-color: #7e22ce; }
        .bg-red-600 { background-color: #dc2626; }
        .bg-red-700 { background-color: #b91c1c; }
        .bg-orange-600 { background-color: #ea580c; }
        .bg-orange-700 { background-color: #c2410c; }
        .bg-black\/40 { background-color: rgba(0, 0, 0, 0.4); }
        .bg-black\/60 { background-color: rgba(0, 0, 0, 0.6); }

        /* Colors - Text */
        .text-white { color: #fff; }
        .text-gray-500 { color: #6b7280; }
        .text-gray-600 { color: #4b5563; }
        .text-gray-700 { color: #374151; }
        .text-gray-900 { color: #111827; }
        .text-blue-700 { color: #1d4ed8; }
        .text-green-700 { color: #15803d; }
        .text-red-700 { color: #b91c1c; }

        /* Typography */
        .text-sm { font-size: 0.875rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-3xl { font-size: 1.875rem; }
        .font-bold { font-weight: 700; }
        .font-medium { font-weight: 500; }
        .leading-none { line-height: 1; }

        /* Borders */
        .border { border: 1px solid var(--color-border); }
        .border-b { border-bottom: 1px solid var(--color-border); }
        .border-t { border-top: 1px solid var(--color-border); }
        .border-gray-200 { border-color: #e5e7eb; }
        .border-gray-300 { border-color: var(--color-border); }
        .border-blue-200 { border-color: #bfdbfe; }
        .border-blue-300 { border-color: #93c5fd; }
        .border-green-300 { border-color: #86efac; }
        .border-purple-300 { border-color: #e879f9; }
        .border-red-300 { border-color: #fca5a5; }

        /* Border radius */
        .rounded { border-radius: var(--radius); }
        .rounded-lg { border-radius: var(--radius-lg); }
        .rounded-xl { border-radius: var(--radius-xl); }

        /* Shadows */
        .shadow-sm { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .shadow-md { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .hover\:shadow-md:hover { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }

        /* Transitions */
        .transition-all { transition: all 0.2s ease; }
        .backdrop-blur-sm { backdrop-filter: blur(4px); }

        /* Forms */
        select, input[type="number"], input[type="file"], textarea {
            font-family: inherit;
            font-size: 1rem;
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            width: 100%;
        }
        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* ===== BUTTONS ===== */
        button {
            cursor: pointer;
            border: none;
            font-family: inherit;
            font-size: 1rem;
            border-radius: var(--radius-lg);
            transition: all 0.2s ease;
            padding: 0.5rem 1rem;
        }
        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }
        
        /* Button Variants */
        .button-primary { background-color: var(--color-primary); color: #fff; }
        .button-primary:hover { background-color: var(--color-primary-dark); }
        .button-secondary { background-color: #e5e7eb; color: #111827; border: 1px solid var(--color-border); }
        .button-secondary:hover { background-color: #f3f4f6; }
        .button-icon {
            padding: 0.5rem;
            background-color: #f3f4f6;
            color: #374151;
            border: 1px solid var(--color-border);
        }
        .button-icon:hover { background-color: #e5e7eb; }
        .button-success { background-color: #16a34a; color: #fff; }
        .button-success:hover { background-color: #15803d; }
        .button-warning { background-color: #ea580c; color: #fff; }
        .button-warning:hover { background-color: #c2410c; }
        .button-danger { background-color: #dc2626; color: #fff; }
        .button-danger:hover { background-color: #b91c1c; }
        .button-accent { background-color: #9333ea; color: #fff; }
        .button-accent:hover { background-color: #7e22ce; }
        
        /* Button Sizes */
        .button-sm { padding: 0.375rem 0.75rem; font-size: 0.875rem; }
        .button-md { padding: 0.5rem 1rem; font-size: 1rem; }
        .button-lg { padding: 0.75rem 1.5rem; font-size: 1.125rem; }



        /* ===== MODALS ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.hidden { display: none; }
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
        }
        .modal-backdrop.dark { background-color: rgba(0, 0, 0, 0.6); }
        .modal-box {
            background-color: #fff;
            border-radius: var(--radius-xl);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            max-width: 42rem;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            z-index: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .modal-box.wide { max-width: 42rem; }
        .modal-box.narrow { max-width: 28rem; }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            background-color: #fff;
            flex-shrink: 0;
        }
        .modal-header-title { font-size: 1.25rem; font-weight: 700; color: #111827; }
        .modal-close-btn {
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            color: #6b7280;
            padding: 0;
            transition: color 0.2s ease;
        }
        .modal-close-btn:hover { color: #374151; }
        .modal-body {
            padding: 1.5rem;
            flex: 1;
            overflow-y: auto;
        }
        .modal-footer {
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
            padding: 1rem 1.5rem;
            border-top: 1px solid #e5e7eb;
            background-color: #f9fafb;
            position: sticky;
            bottom: 0;
            flex-shrink: 0;
        }

        /* ===== EDITOR ===== */
        .editor-toolbar {
            display: flex;
            gap: 0.5rem;
            padding: 0.5rem;
            background-color: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: var(--radius);
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }
        .editor-toolbar-btn {
            padding: 0.375rem 0.75rem;
            font-size: 0.875rem;
            background-color: #fff;
            border: 1px solid var(--color-border);
            color: #374151;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .editor-toolbar-btn:hover { background-color: #e5e7eb; }
        .editor-toolbar-btn.active {
            background-color: #dbeafe;
            border-color: var(--color-primary);
            color: var(--color-primary);
        }
        .editor-field {
            width: 100%;
            min-height: 300px;
            padding: 0.75rem;
            border: 1px solid #e5e7eb;
            border-radius: var(--radius);
            font-size: 0.875rem;
            line-height: 1.4;
            overflow-y: auto;
            font-family: inherit;
        }
        .editor-field:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .editor-info {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 1rem;
        }

        /* ===== REGISTER SELECTOR ===== */
        .register-selector {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            background-color: #f9fafb;
            border-radius: var(--radius-lg);
            border: 1px solid #e5e7eb;
        }
        .register-selector-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #6b7280;
            white-space: nowrap;
        }
        .register-selector-dropdown {
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: var(--radius);
            background-color: #fff;
            font-size: 0.875rem;
            color: #111827;
            cursor: pointer;
            min-width: 150px;
        }
        .register-selector-dropdown:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .register-selector-controls {
            display: flex;
            gap: 0.25rem;
        }
        .register-selector-btn {
            padding: 0.5rem;
            background-color: #e5e7eb;
            border: 1px solid #d1d5db;
            color: #374151;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .register-selector-btn:hover { background-color: #d1d5db; }
        .register-selector-btn.danger { background-color: #fee2e2; color: #b91c1c; border-color: #fca5a5; }
        .register-selector-btn.danger:hover { background-color: #fca5a5; }

        .app-container { display: flex; flex-direction: column; height: 100vh; }
        .app-header {
            background-color: #fff;
            border-bottom: 1px solid #e5e7eb;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        .app-header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1.5rem;
        }
        .app-header-title { font-size: 1.875rem; font-weight: 700; color: #111827; }
        .app-header-toolbar {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .app-main {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: row;
        }
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }
        .preview-sidebar {
            width: 300px;
            flex-shrink: 0;
            border-left: 1px solid #e5e7eb;
            background-color: #f9fafb;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .preview-sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.625rem 0.875rem;
            border-bottom: 1px solid #e5e7eb;
            background-color: #fff;
            font-weight: 600;
            font-size: 0.875rem;
            color: #374151;
            flex-shrink: 0;
        }
        .preview-sidebar-actions { display: flex; gap: 0.25rem; }
        .preview-sidebar-body {
            flex: 1;
            overflow: auto;
            padding: 0.75rem;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        .preview-sidebar-body svg { width: 100%; height: auto; }
        .preview-btn-narrow { display: none !important; }
        @media (max-width: 900px) {
            .preview-sidebar { display: none; }
            .preview-btn-narrow { display: inline-flex !important; }
        }

        /* ===== CONTENT LIST ===== */
        .content-list { display: flex; flex-direction: column; gap: 0.75rem; }
        .content-list-item {
            position: relative;
            background-color: #fff;
            border: 1px solid #e5e7eb;
            border-radius: var(--radius-lg);
            padding: 1rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .content-list-item:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .content-list-item-wrapper {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            min-width: 0;
        }
        .content-list-item-badge {
            flex-shrink: 0;
            width: 3rem;
            height: 3rem;
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-lg);
            font-weight: bold;
            font-size: 1.125rem;
        }
        .content-list-item-actions {
            display: flex;
            gap: 0.25rem;
            flex-shrink: 0;
        }
        .content-list-item-edit-btn {
            padding: 0.25rem;
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1d4ed8;
            border-radius: var(--radius);
            font-size: 1.125rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .content-list-item-edit-btn:hover { background-color: #dbeafe; }
        .content-list-item-content {
            flex: 1;
            min-width: 0;
        }
        .content-list-item-preview {
            font-size: 0.875rem;
            color: #4b5563;
        }
        .content-list-item-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.25rem;
            padding: 0.25rem;
            border: 1px solid #e5e7eb;
            border-radius: var(--radius);
            background-color: white;
            flex-shrink: 0;
        }
        .content-list-item-control-btn {
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            background-color: #f3f4f6;
            border: 1px solid #d1d5db;
            color: #374151;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1;
            text-align: center;
        }
        .content-list-item-control-btn:hover { background-color: #e5e7eb; }
        .content-list-item-control-btn:disabled {
            visibility: hidden;
            pointer-events: none;
        }

        /* Space utilities */
        .space-y-3 { display: flex; flex-direction: column; }
        .space-y-4 { display: flex; flex-direction: column; gap: 1rem; }
        .space-y-3 > * + * { margin-top: 0.75rem; }

        /* Gradients */
        .bg-gradient-to-br { background-image: linear-gradient(135deg, var(--tw-gradient-stops)); }
        .from-blue-400 {
            --tw-gradient-from: #60a5fa;
            --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to, rgba(96, 165, 250, 0));
        }
        .to-blue-600 { --tw-gradient-to: #2563eb; }

        /* Focus styles */
        .focus\:outline-none:focus { outline: 2px solid transparent; outline-offset: 2px; }
        .focus\:ring-2:focus { box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); border-color: var(--color-primary); }
        .focus\:ring-blue-500:focus { --tw-ring-color: #3b82f6; }

        /* Hover styles */
        .hover\:bg-gray-50:hover { background-color: #f9fafb; }
        .hover\:bg-purple-700:hover { background-color: #7e22ce; }
        .hover\:bg-red-700:hover { background-color: #b91c1c; }
        .hover\:bg-orange-700:hover { background-color: #c2410c; }
        .hover\:bg-green-700:hover { background-color: #15803d; }
        .hover\:bg-blue-700:hover { background-color: var(--color-primary-dark); }

        /* Print Styles */
        @media print {
            body > *:not(.print-only) { display: none !important; }
            .print-only { display: block !important; }
        }
    </style>
</head>

<body class="bg-gray-50">
    <!-- Main Application Container -->
    <div id="app" class="app-container">

        <!-- Header / Control Panel -->
        <header class="app-header">
            <div class="app-header-inner">
                <h1 class="app-header-title">SVG Ordner Register</h1>
                
                <!-- Register Selector -->
                <div class="register-selector">
                    <span class="register-selector-label">Ordner:</span>
                    <select id="registerSelector" onchange="app.switchRegister()" class="register-selector-dropdown">
                        <!-- Options will be populated by JS -->
                    </select>
                    <div class="register-selector-controls">
                        <button onclick="app.renameRegister()" class="register-selector-btn" title="Umbenennen">✏️</button>
                        <button onclick="app.createRegister()" class="register-selector-btn" title="Neu">➕</button>
                        <button onclick="app.deleteRegister()" class="register-selector-btn danger" title="Löschen">🗑️</button>
                    </div>
                </div>
                
                <div class="app-header-toolbar">
                    <button onclick="app.openSettingsModal()"
                        class="button-icon"
                        title="Einstellungen">
                        ⚙️
                    </button>
                    <button onclick="app.exportJSON()"
                        class="button-success button-sm"
                        title="Export">
                        💾 Export
                    </button>
                    <button onclick="document.getElementById('fileImport').click()"
                        class="button-accent button-sm"
                        title="Import">
                        📂 Import
                    </button>
                    <button onclick="app.resetAll()"
                        class="button-danger button-sm"
                        title="Reset">
                        🔄 Reset
                    </button>
                    <input type="file" id="fileImport" accept=".json" onchange="app.importJSON(event)" class="hidden">
                    <button onclick="app.openPreviewModal()"
                        class="button-primary preview-btn-narrow"
                        title="Vorschau">
                        👁 Vorschau
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="app-main">
            <div class="content-area">
                <div id="contentsList" class="content-list">
                    <!-- Content list items will be inserted here dynamically -->
                </div>
            </div>
            <!-- Preview Sidebar (always visible on wide screens) -->
            <aside class="preview-sidebar" id="previewSidebar">
                <div class="preview-sidebar-header">
                    <span>Vorschau</span>
                    <div class="preview-sidebar-actions">
                        <button onclick="app.printSVG()" class="button-icon" style="padding:0.25rem 0.5rem;font-size:0.875rem;" title="Drucken">🖨️</button>
                        <button onclick="app.downloadSVG()" class="button-icon" style="padding:0.25rem 0.5rem;font-size:0.875rem;" title="Herunterladen">💾</button>
                    </div>
                </div>
                <div class="preview-sidebar-body" id="sidebarPreviewContainer"></div>
            </aside>
        </main>
    </div>

    <!-- Rename Register Modal -->
    <div id="renameModal" class="modal-overlay z-50 hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-box narrow">
            <div class="modal-header">
                <h2 class="modal-header-title">Ordner umbenennen</h2>
                <button onclick="app.closeRenameModal()" class="modal-close-btn">✕</button>
            </div>

            <div class="modal-body">
                <div>
                    <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">Neuer Name:</label>
                    <input type="text" id="renameInput" style="width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: var(--radius); font-size: 0.875rem; outline: none; transition: all 0.2s ease;" placeholder="z.B. Kunden, Projekte, Archiv" onfocus="this.style.borderColor = 'var(--color-primary)'; this.style.boxShadow = '0 0 0 3px rgba(37, 99, 235, 0.1)';" onblur="this.style.borderColor = '#d1d5db'; this.style.boxShadow = 'none';">
                </div>
            </div>

            <div class="modal-footer">
                <button onclick="app.closeRenameModal()" class="button-secondary button-sm">Abbrechen</button>
                <button onclick="app.saveRegisterName()" class="button-primary button-sm">Speichern</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-overlay z-50 hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-box narrow">
            <div class="modal-header">
                <h2 class="modal-header-title">Register <span id="modalRegisterIndex"></span> bearbeiten</h2>
                <button onclick="app.closeEditModal()" class="modal-close-btn">✕</button>
            </div>

            <div class="modal-body">
                <!-- Editor Toolbar -->
                <div class="editor-toolbar">
                    <button type="button" onclick="app.toggleBold()" class="editor-toolbar-btn" title="Fett (Ctrl+B)">**Bold**</button>
                    <button type="button" onclick="app.toggleItalic()" class="editor-toolbar-btn" title="Kursiv (Ctrl+I)"><em>Italic</em></button>
                    <button type="button" onclick="app.toggleUnderline()" class="editor-toolbar-btn" title="Unterstrichen (Ctrl+U)"><u>Underline</u></button>
                    <button type="button" onclick="app.decreaseSize()" class="editor-toolbar-btn" title="Kleiner (Auswahl)">A−</button>
                    <button type="button" onclick="app.resetSize()"    class="editor-toolbar-btn" title="Schriftgröße zurücksetzen (Auswahl)">A</button>
                    <button type="button" onclick="app.increaseSize()" class="editor-toolbar-btn" title="Größer (Auswahl)">A+</button>
                </div>
                <!-- ContentEditable Editor -->
                <div id="contentEditor" contenteditable="true" class="editor-field"></div>
                <!-- Toolbar Info -->
                <p class="editor-info">Verwenden Sie die Werkzeugleiste oben, um Text zu formatieren: Fett, Kursiv, Größer/Kleiner.</p>
            </div>

            <div class="modal-footer">
                <button onclick="app.closeEditModal()" class="button-secondary button-sm">Abbrechen</button>
                <button onclick="app.saveEditModal()" class="button-primary button-sm">Speichern</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay z-50 hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-box narrow">
            <div class="modal-header">
                <h2 class="modal-header-title">Einstellungen</h2>
                <button onclick="app.closeSettingsModal()" class="modal-close-btn">✕</button>
            </div>

            <div class="modal-body space-y-4">
                <!-- Page Format -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Format</label>
                    <select id="pageFormatSelect" onchange="app.handleFormatChange()"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="A0">A0</option>
                        <option value="A1">A1</option>
                        <option value="A2">A2</option>
                        <option value="A3">A3</option>
                        <option value="A4" selected>A4</option>
                        <option value="A5">A5</option>
                        <option value="A6">A6</option>
                        <option value="Letter">Letter</option>
                        <option value="Legal">Legal</option>
                        <option value="Tabloid">Tabloid</option>
                    </select>
                </div>

                <!-- Orientation -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Ausrichtung</label>
                    <select id="orientationSelect" onchange="app.handleFormatChange()"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="portrait">Hochformat</option>
                        <option value="landscape">Querformat</option>
                    </select>
                </div>

                <!-- Register Count -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Register (2-31)</label>
                    <input type="number" id="registerCountInput" min="2" max="31" value="10"
                        onchange="app.handleRegisterCountChange()"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="modal-footer">
                <button onclick="app.closeSettingsModal()" class="button-secondary button-sm">Schließen</button>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="previewModal" class="modal-overlay z-40 hidden">
        <div class="modal-backdrop dark"></div>
        <div class="modal-box wide">
            <div class="modal-header">
                <h2 class="modal-header-title">Vorschau</h2>
                <button onclick="app.closePreviewModal()" class="modal-close-btn">✕</button>
            </div>

            <div class="modal-body flex items-center justify-center p-4">
                <div id="previewContainer" class="bg-white border border-gray-300 rounded shadow-lg" style="aspect-ratio: auto;">
                    <!-- SVG will be rendered here -->
                </div>
            </div>

            <div class="modal-footer">
                <button onclick="app.printSVG()" class="button-warning button-sm" title="SVG drucken">🖨️</button>
                <button onclick="app.downloadSVG()" class="button-success button-sm" title="SVG herunterladen">💾</button>
                <button onclick="app.closePreviewModal()" class="button-secondary button-sm">Schließen</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================================
        // Application State & Configuration
        // ============================================================================

        const PAGE_FORMATS = {
            'A0': { width: 841, height: 1189 },
            'A1': { width: 594, height: 841 },
            'A2': { width: 420, height: 594 },
            'A3': { width: 297, height: 420 },
            'A4': { width: 210, height: 297 },
            'A5': { width: 148, height: 210 },
            'A6': { width: 105, height: 148 },
            'Letter': { width: 216, height: 279 },
            'Legal': { width: 216, height: 356 },
            'Tabloid': { width: 279, height: 432 }
        };

        const app = {
            // State
            registers: [],  // Array of { id, name, registerCount, pageFormat, pageOrientation, contents }
            currentRegisterIndex: 0,  // Index of active register
            currentEditIndex: null,

            // Initialize
            init() {
                this.loadState();
                if (this.registers.length === 0) {
                    this.createRegister('Standard');
                }
                this.renderRegisterSelector();
                this.renderContentsList();
                this.initQuillEditor();
                this.attachEventListeners();
            },

            // ========================================================================
            // State Management
            // ========================================================================

            getCurrentRegister() {
                return this.registers[this.currentRegisterIndex];
            },

            loadState() {
                const saved = localStorage.getItem('registerState');
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        
                        // Check if it's old single-register format or new multi-register format
                        if (Array.isArray(data)) {
                            // New format: array of registers
                            this.registers = data;
                        } else if (data.contents !== undefined) {
                            // Old format: single register object
                            // Convert to new format
                            const oldRegister = {
                                id: Date.now().toString(),
                                name: 'Standard',
                                registerCount: data.registerCount || 10,
                                pageFormat: data.pageFormat || 'A4',
                                pageOrientation: data.pageOrientation || 'portrait',
                                contents: data.contents || []
                            };
                            this.registers = [oldRegister];
                        } else {
                            this.registers = [];
                        }
                        
                        this.currentRegisterIndex = 0;
                    } catch (e) {
                        console.error('Failed to load state:', e);
                        this.registers = [];
                    }
                } else {
                    this.registers = [];
                }
            },

            saveState() {
                localStorage.setItem('registerState', JSON.stringify(this.registers));
            },

            updateUIFromState() {
                const register = this.getCurrentRegister();
                if (register) {
                    document.getElementById('registerCountInput').value = register.registerCount;
                    document.getElementById('pageFormatSelect').value = register.pageFormat;
                    document.getElementById('orientationSelect').value = register.pageOrientation;
                }
            },

            initializeContents(register) {
                while (register.contents.length < 31) {
                    register.contents.push('');
                }
            },

            // ========================================================================
            // Register Management
            // ========================================================================

            renderRegisterSelector() {
                const selector = document.getElementById('registerSelector');
                selector.innerHTML = '';
                this.registers.forEach((register, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = register.name;
                    if (index === this.currentRegisterIndex) {
                        option.selected = true;
                    }
                    selector.appendChild(option);
                });
            },

            switchRegister() {
                const selector = document.getElementById('registerSelector');
                this.currentRegisterIndex = parseInt(selector.value);
                this.updateUIFromState();
                this.renderContentsList();
            },

            createRegister(name = null) {
                const newName = name || prompt('Name für neues Ordner-Register:', 'Neuer Ordner');
                if (!newName) return;

                const newRegister = {
                    id: Date.now().toString(),
                    name: newName,
                    registerCount: 10,
                    pageFormat: 'A4',
                    pageOrientation: 'portrait',
                    contents: []
                };
                this.initializeContents(newRegister);
                this.registers.push(newRegister);
                this.currentRegisterIndex = this.registers.length - 1;
                this.saveState();
                this.renderRegisterSelector();
                this.updateUIFromState();
                this.renderContentsList();
            },

            renameRegister() {
                const register = this.getCurrentRegister();
                if (!register) return;

                document.getElementById('renameInput').value = register.name;
                document.getElementById('renameModal').classList.remove('hidden');
                document.getElementById('renameInput').focus();
            },

            closeRenameModal() {
                document.getElementById('renameModal').classList.add('hidden');
            },

            saveRegisterName() {
                const newName = document.getElementById('renameInput').value.trim();
                if (!newName) {
                    alert('Name darf nicht leer sein!');
                    return;
                }

                const register = this.getCurrentRegister();
                register.name = newName;
                this.saveState();
                this.renderRegisterSelector();
                this.closeRenameModal();
            },

            deleteRegister() {
                if (this.registers.length <= 1) {
                    alert('Es muss mindestens ein Ordner-Register vorhanden sein!');
                    return;
                }

                const register = this.getCurrentRegister();
                if (confirm(`Wirklich den Ordner "${register.name}" löschen?`)) {
                    this.registers.splice(this.currentRegisterIndex, 1);
                    if (this.currentRegisterIndex >= this.registers.length) {
                        this.currentRegisterIndex = this.registers.length - 1;
                    }
                    this.saveState();
                    this.renderRegisterSelector();
                    this.updateUIFromState();
                    this.renderContentsList();
                }
            },

            // ========================================================================
            // Event Handlers
            // ========================================================================

            handleFormatChange() {
                const register = this.getCurrentRegister();
                register.pageFormat = document.getElementById('pageFormatSelect').value;
                register.pageOrientation = document.getElementById('orientationSelect').value;
                this.saveState();
                this.renderContentsList();
            },

            handleRegisterCountChange() {
                const register = this.getCurrentRegister();
                const newCount = parseInt(document.getElementById('registerCountInput').value);
                if (newCount >= 2 && newCount <= 31) {
                    register.registerCount = newCount;
                    this.saveState();
                    this.renderContentsList();
                }
            },

            attachEventListeners() {
                // No additional event listeners needed beyond inline handlers
            },

            // ========================================================================
            // List Rendering
            // ========================================================================

            renderContentsList() {
                const container = document.getElementById('contentsList');
                container.innerHTML = '';
                const register = this.getCurrentRegister();

                for (let i = 0; i < register.registerCount; i++) {
                    const item = this.createContentListItem(i);
                    container.appendChild(item);
                }
                this.renderSidebarPreview();
            },

            renderSidebarPreview() {
                const container = document.getElementById('sidebarPreviewContainer');
                if (!container) return;
                const svg = this.generateSVG();
                container.innerHTML = svg;
            },

            createContentListItem(index) {
                const div = document.createElement('div');
                div.className = 'content-list-item';

                const register = this.getCurrentRegister();
                const content = register.contents[index];
                const preview = content.replace(/<[^>]*>/g, '').substring(0, 100) || '(leer)';

                const canUp   = index > 0;
                const canDown = index < register.registerCount - 1;

                div.innerHTML = `
                    <div class="content-list-item-wrapper">
                        <div class="content-list-item-badge">${index + 1}</div>
                        <div class="content-list-item-actions">
                            <button onclick="app.openEditModal(${index})" class="content-list-item-edit-btn" title="Bearbeiten">✏️</button>
                        </div>
                        <div class="content-list-item-content">
                            <div class="content-list-item-preview">${this.htmlToPreview(preview)}</div>
                        </div>
                    </div>
                    <!-- Reordering Controls: 2×2 Grid -->
                    <div class="content-list-item-controls">
                        <button onclick="app.moveUp(${index})"       class="content-list-item-control-btn" title="Nach oben"       ${canUp   ? '' : 'disabled'}>▲</button>
                        <button onclick="app.moveToTop(${index})"    class="content-list-item-control-btn" title="Ganz nach oben"  ${canUp   ? '' : 'disabled'}>▲▲</button>
                        <button onclick="app.moveDown(${index})"     class="content-list-item-control-btn" title="Nach unten"      ${canDown ? '' : 'disabled'}>▼</button>
                        <button onclick="app.moveToBottom(${index})" class="content-list-item-control-btn" title="Ganz nach unten" ${canDown ? '' : 'disabled'}>▼▼</button>
                    </div>
                `;

                return div;
            },

            htmlToPreview(text) {
                return text.split('\n').slice(0, 2).join(' â†’ ') || '(leer)';
            },

            // ========================================================================
            // Reordering
            // ========================================================================

            moveUp(index) {
                const register = this.getCurrentRegister();
                if (index > 0) {
                    [register.contents[index], register.contents[index - 1]] = [register.contents[index - 1], register.contents[index]];
                    this.saveState();
                    this.renderContentsList();
                }
            },

            moveDown(index) {
                const register = this.getCurrentRegister();
                if (index < register.registerCount - 1) {
                    [register.contents[index], register.contents[index + 1]] = [register.contents[index + 1], register.contents[index]];
                    this.saveState();
                    this.renderContentsList();
                }
            },

            moveToTop(index) {
                const register = this.getCurrentRegister();
                if (index > 0) {
                    const item = register.contents[index];
                    register.contents.splice(index, 1);
                    register.contents.splice(0, 0, item);
                    this.saveState();
                    this.renderContentsList();
                }
            },

            moveToBottom(index) {
                const register = this.getCurrentRegister();
                if (index < register.registerCount - 1) {
                    const item = register.contents[index];
                    register.contents.splice(index, 1);
                    register.contents.splice(register.registerCount - 1, 0, item);
                    this.saveState();
                    this.renderContentsList();
                }
            },

            // ========================================================================
            // Quill Editor Management
            // ========================================================================

            initQuillEditor() {
                // Using contenteditable instead of Quill.js for offline compatibility
                const editor = document.getElementById('contentEditor');
                if (editor) {
                    editor.addEventListener('keydown', (e) => {
                        if (e.ctrlKey || e.metaKey) {
                            if (e.key === 'b') { e.preventDefault(); app.toggleBold(); }
                            if (e.key === 'i') { e.preventDefault(); app.toggleItalic(); }
                            if (e.key === 'u') { e.preventDefault(); app.toggleUnderline(); }
                        }
                    });
                }
            },

            toggleBold() { document.execCommand('bold', false, null); this.focusEditor(); },
            toggleItalic() { document.execCommand('italic', false, null); this.focusEditor(); },
            toggleUnderline() { document.execCommand('underline', false, null); this.focusEditor(); },
            increaseSize() { this._adjustFontSize(+2); this.focusEditor(); },
            decreaseSize() { this._adjustFontSize(-2); this.focusEditor(); },
            resetSize()    { this._applyFontSize('14px'); this.focusEditor(); },

            _adjustFontSize(delta) {
                const sel = window.getSelection();
                if (!sel || !sel.toString()) return;
                const range = sel.getRangeAt(0);
                let container = range.startContainer;
                if (container.nodeType === 3) container = container.parentElement;
                const current = parseFloat(window.getComputedStyle(container).fontSize) || 14;
                const newSize = Math.max(8, Math.min(72, current + delta)) + 'px';
                this._applyFontSize(newSize);
            },

            _applyFontSize(size) {
                const sel = window.getSelection();
                if (!sel || !sel.toString()) return;
                const range = sel.getRangeAt(0);
                const span = document.createElement('span');
                span.style.fontSize = size;
                try {
                    range.surroundContents(span);
                } catch(e) {
                    const frag = range.extractContents();
                    span.appendChild(frag);
                    range.insertNode(span);
                }
                // Innere font-size-Angaben entfernen – nur der äußere Span ist maßgeblich
                span.querySelectorAll('[style]').forEach(el => {
                    el.style.removeProperty('font-size');
                    if (!el.getAttribute('style').trim()) el.removeAttribute('style');
                });
                const newRange = document.createRange();
                newRange.selectNodeContents(span);
                sel.removeAllRanges();
                sel.addRange(newRange);
            },
            focusEditor() {
                const editor = document.getElementById('contentEditor');
                if (editor) editor.focus();
            },

            // ========================================================================
            // Edit Modal
            // ========================================================================

            openEditModal(index) {
                this.currentEditIndex = index;
                document.getElementById('modalRegisterIndex').textContent = index + 1;

                const modal = document.getElementById('editModal');
                modal.classList.remove('hidden');

                // Load content into contentEditable editor
                const register = this.getCurrentRegister();
                const editor = document.getElementById('contentEditor');
                if (editor) {
                    editor.innerHTML = register.contents[index] || '';
                    setTimeout(() => editor.focus(), 100);
                }
            },

            closeEditModal() {
                document.getElementById('editModal').classList.add('hidden');
                this.currentEditIndex = null;
            },

            saveEditModal() {
                if (this.currentEditIndex !== null) {
                    const register = this.getCurrentRegister();
                    const editor = document.getElementById('contentEditor');
                    register.contents[this.currentEditIndex] = editor.innerHTML || '';
                    this.saveState();
                    this.closeEditModal();
                    this.renderContentsList();
                }
            },

            // ========================================================================
            // SVG Generation
            // ========================================================================

            getSVGDimensions() {
                const register = this.getCurrentRegister();
                let format = PAGE_FORMATS[register.pageFormat];
                let width = format.width;
                let height = format.height;

                if (register.pageOrientation === 'landscape') {
                    [width, height] = [height, width];
                }

                return { width, height };
            },

            generateSVG() {
                const register = this.getCurrentRegister();
                const { width, height } = this.getSVGDimensions();
                const slotHeight = height / register.registerCount;
                const dividerX = width * 3 / 10;

                let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet" style="max-width: 100%; max-height: 100%; width: 100%; height: auto;">
                    <defs>
                        <style>
                            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&family=Roboto+Mono:wght@400&display=swap');
                            * { font-family: 'Inter', sans-serif; }
                        </style>
                    </defs>
                    
                    <!-- Background -->
                    <rect width="${width}" height="${height}" fill="white"/>
                `;

                // Draw divider lines and content slots
                for (let i = 0; i < register.registerCount; i++) {
                    const y = i * slotHeight;
                    const nextY = (i + 1) * slotHeight;

                    // Vertical divider at left
                    svg += `<line x1="${dividerX - 1}" y1="${y}" x2="${dividerX - 1}" y2="${nextY}" stroke="#999" stroke-width="0.5"/>`;
                    svg += `<line x1="${dividerX}" y1="${y}" x2="${dividerX}" y2="${nextY}" stroke="#000" stroke-width="1"/>`;

                    // Horizontal dividers
                    if (i > 0) {
                        svg += `<line x1="0" y1="${y}" x2="${width}" y2="${y}" stroke="#ddd" stroke-width="0.5"/>`;
                    }

                    // Index number - vertically centered
                    svg += `<text x="${dividerX / 2}" y="${y + slotHeight / 2}" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="bold" fill="#333">${i + 1}</text>`;

                    // Content using foreignObject for rich HTML support
                    svg += `<foreignObject x="${dividerX + 5}" y="${y + 5}" width="${width - dividerX - 10}" height="${slotHeight - 10}">
                        <div xmlns="http://www.w3.org/1999/xhtml" style="font-size: 12px; line-height: 1.4; overflow: hidden; color: #000;">
                            ${register.contents[i]}
                        </div>
                    </foreignObject>`;
                }

                svg += `</svg>`;
                return svg;
            },

            // ========================================================================
            // Settings Modal
            // ========================================================================

            openSettingsModal() {
                document.getElementById('settingsModal').classList.remove('hidden');
                // Refresh UI values in case they were changed
                this.updateUIFromState();
            },

            closeSettingsModal() {
                document.getElementById('settingsModal').classList.add('hidden');
            },

            // ========================================================================
            // Preview Modal
            // ========================================================================

            openPreviewModal() {
                document.getElementById('previewModal').classList.remove('hidden');
                this.renderPreview();
            },

            closePreviewModal() {
                document.getElementById('previewModal').classList.add('hidden');
            },

            renderPreview() {
                const svg = this.generateSVG();
                const container = document.getElementById('previewContainer');
                container.innerHTML = svg;

                // Get SVG dimensions and calculate scaling to fit screen
                const { width, height } = this.getSVGDimensions();
                const maxWidth = container.parentElement.clientWidth - 30; // Account for padding
                const maxHeight = container.parentElement.clientHeight - 30;

                const widthRatio = maxWidth / width;
                const heightRatio = maxHeight / height;
                // Scale up to 1.5x for better readability, or fit if smaller
                const scale = Math.min(Math.max(widthRatio, heightRatio), 1.5);

                container.style.width = (width * scale) + 'px';
                container.style.height = (height * scale) + 'px';
                container.style.overflow = 'auto';
                container.style.display = 'inline-block';
            },

            downloadSVG() {
                const svg = this.generateSVG();
                const blob = new Blob([svg], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `ordnerregister_${new Date().toISOString().split('T')[0]}.svg`;
                a.click();
                URL.revokeObjectURL(url);
            },

            printSVG() {
                const svg = this.generateSVG();
                const iframe = document.createElement('iframe');
                iframe.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;border:none;';
                document.body.appendChild(iframe);
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                doc.open();
                doc.write(`<!DOCTYPE html><html><head><title>Ordner Register</title><style>@page{margin:10mm;}body{margin:0;padding:0;}svg{width:100%;height:auto;}</style></head><body>${svg}</body></html>`);
                doc.close();
                iframe.contentWindow.focus();
                setTimeout(() => {
                    iframe.contentWindow.print();
                    setTimeout(() => { if (document.body.contains(iframe)) document.body.removeChild(iframe); }, 2000);
                }, 300);
            },

            // ========================================================================
            // Import / Export
            // ========================================================================

            exportJSON() {
                const register = this.getCurrentRegister();
                const data = {
                    registerName: register.name,
                    registerCount: register.registerCount,
                    pageFormat: register.pageFormat,
                    pageOrientation: register.pageOrientation,
                    contents: register.contents.slice(0, register.registerCount),
                    exportDate: new Date().toISOString()
                };

                const json = JSON.stringify(data, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `ordnerregister_${register.name}_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
            },

            importJSON(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);

                        // Determine import name
                        let importName = data.registerName || 'Importierter Ordner';
                        
                        // Check if register with this name exists
                        const existingIndex = this.registers.findIndex(r => r.name === importName);
                        
                        if (existingIndex !== -1) {
                            // Ask user what to do
                            const choice = confirm(`Ordner "${importName}" existiert bereits.\n\nOK = Überschreiben\nAbbrechen = Neuen Ordner erstellen`);
                            
                            if (!choice) {
                                // Create new register with modified name
                                let newName = importName + ' (Import)';
                                let counter = 1;
                                while (this.registers.findIndex(r => r.name === newName) !== -1) {
                                    counter++;
                                    newName = importName + ` (Import ${counter})`;
                                }
                                importName = newName;
                            }
                        }

                        const newRegister = {
                            id: Date.now().toString(),
                            name: importName,
                            registerCount: data.registerCount || 10,
                            pageFormat: data.pageFormat || 'A4',
                            pageOrientation: data.pageOrientation || 'portrait',
                            contents: data.contents || []
                        };

                        this.initializeContents(newRegister);

                        // If existing register, replace it
                        if (existingIndex !== -1) {
                            this.registers[existingIndex] = newRegister;
                            this.currentRegisterIndex = existingIndex;
                        } else {
                            // Add new register
                            this.registers.push(newRegister);
                            this.currentRegisterIndex = this.registers.length - 1;
                        }

                        this.saveState();
                        this.renderRegisterSelector();
                        this.updateUIFromState();
                        this.renderContentsList();

                        alert(`Ordner "${importName}" erfolgreich importiert!`);
                    } catch (err) {
                        alert('Fehler beim Importieren der Datei: ' + err.message);
                    }
                };
                reader.readAsText(file);

                // Reset file input
                event.target.value = '';
            },

            // ========================================================================
            // Utilities
            // ========================================================================
            // Utilities
            // ========================================================================

            resetAll() {
                if (confirm('Wirklich alle Daten und alle Ordner zurücksetzen?')) {
                    this.registers = [];
                    this.currentRegisterIndex = 0;
                    this.createRegister('Standard');
                    this.renderRegisterSelector();
                    this.updateUIFromState();
                    this.renderContentsList();
                }
            }
        };

        // Initialize app on page load
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
